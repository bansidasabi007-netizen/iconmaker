<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

    <defs>

        <pattern id="contour"
                 width="40"
                 height="40"
                 patternUnits="userSpaceOnUse">

            <circle cx="20" cy="20" r="8"
                    fill="none"
                    stroke="black"
                    stroke-width="1.5"
                    stroke-opacity="0.75"/>

            <circle cx="20" cy="20" r="15"
                    fill="none"
                    stroke="black"
                    stroke-width="1.5"
                    stroke-opacity="0.75"/>

        </pattern>

    </defs>

    <rect width="100%"
          height="100%"
          fill="url(#contour)"/>

</svg>