<svg xmlns="http://www.w3.org/2000/svg"
     width="240"
     height="240"
     viewBox="0 0 240 240">

    <defs>

        <pattern id="fabric"
                 width="32"
                 height="32"
                 patternUnits="userSpaceOnUse">

            <!-- Vertical Threads -->
            <line x1="4"  y1="0" x2="4"  y2="32"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

            <line x1="12" y1="0" x2="12" y2="32"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

            <line x1="20" y1="0" x2="20" y2="32"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

            <line x1="28" y1="0" x2="28" y2="32"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.18"/>

            <!-- Horizontal Threads -->
            <line x1="0" y1="4"  x2="32" y2="4"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.10"/>

            <line x1="0" y1="12" x2="32" y2="12"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

            <line x1="0" y1="20" x2="32" y2="20"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

            <line x1="0" y1="28" x2="32" y2="28"
                  stroke="black"
                  stroke-width="1"
                  stroke-opacity="0.75"/>

        </pattern>

    </defs>

    <rect
        width="100%"
        height="100%"
        fill="url(#fabric)"/>

</svg>