<svg xmlns="http://www.w3.org/2000/svg"
     width="240"
     height="240"
     viewBox="0 0 240 240">

    <defs>

        <pattern id="mosaic"
                 width="40"
                 height="40"
                 patternUnits="userSpaceOnUse">

            <!-- Top Left -->
            <rect x="2" y="2"
                  width="16"
                  height="16"
                  rx="2"
                  fill="none"
                  stroke="black"
                  stroke-width="1.2"
                  stroke-opacity="0.75"/>

            <!-- Top Right -->
            <rect x="22" y="2"
                  width="16"
                  height="16"
                  rx="2"
                  fill="none"
                  stroke="black"
                  stroke-width="1.2"
                  stroke-opacity="0.75"/>

            <!-- Bottom Left -->
            <rect x="2" y="22"
                  width="16"
                  height="16"
                  rx="2"
                  fill="none"
                  stroke="black"
                  stroke-width="1.2"
                  stroke-opacity="0.75"/>

            <!-- Bottom Right -->
            <rect x="22" y="22"
                  width="16"
                  height="16"
                  rx="2"
                  fill="none"
                  stroke="black"
                  stroke-width="1.2"
                  stroke-opacity="0.75"/>

        </pattern>

    </defs>

    <rect
        width="100%"
        height="100%"
        fill="url(#mosaic)"/>

</svg>