<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

    <defs>

        <pattern id="halftone"
                 width="40"
                 height="40"
                 patternUnits="userSpaceOnUse">

            <!-- Top Row -->
            <circle cx="5"  cy="5"  r="1"   fill="black" fill-opacity="0.12"/>
            <circle cx="15" cy="5"  r="1.8" fill="black" fill-opacity="0.12"/>
            <circle cx="25" cy="5"  r="2.8" fill="black" fill-opacity="0.12"/>
            <circle cx="35" cy="5"  r="3.8" fill="black" fill-opacity="0.12"/>

            <!-- Second Row -->
            <circle cx="5"  cy="15" r="1.8" fill="black" fill-opacity="0.12"/>
            <circle cx="15" cy="15" r="2.8" fill="black" fill-opacity="0.12"/>
            <circle cx="25" cy="15" r="3.8" fill="black" fill-opacity="0.12"/>
            <circle cx="35" cy="15" r="4.8" fill="black" fill-opacity="0.12"/>

            <!-- Third Row -->
            <circle cx="5"  cy="25" r="2.8" fill="black" fill-opacity="0.12"/>
            <circle cx="15" cy="25" r="3.8" fill="black" fill-opacity="0.12"/>
            <circle cx="25" cy="25" r="4.8" fill="black" fill-opacity="0.12"/>
            <circle cx="35" cy="25" r="6"   fill="black" fill-opacity="0.12"/>

            <!-- Bottom Row -->
            <circle cx="5"  cy="35" r="3.8" fill="black" fill-opacity="0.12"/>
            <circle cx="15" cy="35" r="4.8" fill="black" fill-opacity="0.12"/>
            <circle cx="25" cy="35" r="6"   fill="black" fill-opacity="0.12"/>
            <circle cx="35" cy="35" r="7.2" fill="black" fill-opacity="0.12"/>

        </pattern>

    </defs>

    <rect
        width="100%"
        height="100%"
        fill="url(#halftone)"/>

</svg>